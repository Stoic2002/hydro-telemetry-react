# Konfigurasi penyajian dashboard telemetering PLTA.
#
# Satu checkout melayani dua environment dari dua direktori build:
#
#   bun run build          -> dist/          (production, backend :8000)
#   bun run build:staging  -> dist-staging/  (staging,    backend :18000)
#
# Alamat backend sudah ikut ter-bundle saat build, jadi kedua direktori berbeda
# isinya dan tidak boleh saling menimpa.
#
# Salin ke /etc/nginx/sites-available/ lalu buat symlink ke sites-enabled/.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name _;

  root /var/www/frontend-telemetering/hydro-telemetry-react/dist;
  index index.html;

  access_log /var/log/nginx/telemetering-prod.access.log;
  error_log  /var/log/nginx/telemetering-prod.error.log;

  # Hash pada nama file aset membuatnya aman di-cache selamanya.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Data peta jarang berubah tetapi namanya tidak ber-hash, jadi cache-nya
  # dibuat pendek supaya pembaruan tetap sampai ke operator.
  location ~* \.json$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html tidak boleh di-cache, agar deploy baru langsung terpakai.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Wajib: seluruh routing ditangani di sisi klien. Tanpa baris ini, refresh
  # browser pada /dashboard/plta/<id>/trends menghasilkan 404 karena file
  # dengan nama itu memang tidak ada di disk.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ---------------------------------------------------------------------------
# Staging
# ---------------------------------------------------------------------------
server {
  listen 8080;
  server_name _;

  root /var/www/frontend-telemetering/hydro-telemetry-react/dist-staging;
  index index.html;

  access_log /var/log/nginx/telemetering-staging.access.log;
  error_log  /var/log/nginx/telemetering-staging.error.log;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.json$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ---------------------------------------------------------------------------
# Alternatif: proksikan backend pada origin yang sama.
#
# Dengan VITE_API_BASE_URL berisi URL absolut, browser mengakses backend lintas
# origin sambil mengirim credentials, sehingga backend wajib mengembalikan
# Access-Control-Allow-Origin berisi origin frontend secara eksplisit (bukan *)
# beserta Access-Control-Allow-Credentials: true. Dengan dua environment, kedua
# origin harus didaftarkan.
#
# Bila lebih mudah menghindari CORS sepenuhnya, tambahkan blok berikut ke server
# block yang bersangkutan lalu isi VITE_API_BASE_URL dengan "/" saja. WebSocket
# monitoring ikut tertangani karena header Upgrade diteruskan.
